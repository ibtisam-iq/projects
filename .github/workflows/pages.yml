name: CI/CD — projects.ibtisam-iq.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deploys: cancel in-progress if new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

# Minimal default permissions, elevated per-job only
permissions:
  contents: read

jobs:

  # ────────────────────────────────────────────────────────────────
  # JOB 1: Build
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall regenerates src/data/projects.ts from data/projects.yaml.
      # The generated file is gitignored, so this is what creates it in CI.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Every route must carry its own og:url. A shell left on the site root
      # means the meta swap silently failed, and crawlers that do not run JS
      # (LinkedIn, Slack) would resolve every project page back to the root.
      - name: Verify per-route metadata
        run: |
          fail=0
          for f in dist/*/index.html; do
            case "$f" in dist/assets/*) continue ;; esac
            route="$(basename "$(dirname "$f")")"
            if ! grep -q "og:url\" content=\"https://projects.ibtisam-iq.com/$route\"" "$f"; then
              echo "::error file=$f::og:url does not point at /$route"
              fail=1
            fi
          done
          exit $fail

      - name: Add CNAME
        run: echo "projects.ibtisam-iq.com" > dist/CNAME

      # 404.html is emitted by scripts/prerender-meta.js during the build, with its
      # own title and noindex. Copying index.html here would overwrite that.

      - name: Upload artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # ────────────────────────────────────────────────────────────────
  # JOB 2: Deploy (only runs after build succeeds)
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    # Required permissions for official OIDC-based Pages deploy
    permissions:
      pages: write
      id-token: write

    # Ties deployment to the github-pages environment (shows URL in UI)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        if: ${{ env.ACT != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5

# One prerequisite: In repo → Settings → Pages → Source, set it to "GitHub Actions" (not "Deploy from a branch").
# This is required for actions/deploy-pages to work.
