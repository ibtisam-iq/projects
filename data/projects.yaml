- slug: debugbox
  title: "DebugBox: Multi-Arch Kubernetes Diagnostics Toolkit with 3 Size-Optimized Variants, Trivy Gating, Hadolint, and MkDocs"
  metaTitle: "DebugBox: Right-Sized Kubernetes Debug Containers"
  category: tool
  status: maintained
  year: 2026
  shortDescription: >-
    Built an open-source Kubernetes debugging toolkit with 3 Alpine variants (15MB to 91MB),
    93% smaller than netshoot. Automated multi-arch builds with Trivy gating, in-container
    smoke tests, and a MkDocs documentation site.
  description: >-
    Built an open-source Kubernetes troubleshooting toolkit as an alternative to images like netshoot, which pull
    hundreds of megabytes for simple connectivity checks. DebugBox offers 3 right-sized Alpine-based variants: Lite (15MB)
    for DNS and HTTP checks, Balanced (47MB) for general debugging, and Power (91MB) for packet capture and deep inspection.
    The Lite variant is 93% smaller than netshoot.

    I separated Dockerfiles (declarative) from installation scripts (procedural): package lists live in '.packages' files,
    and complex installs (like yq with architecture detection and SHA256 verification) have dedicated scripts. All tool
    versions and base images are pinned for deterministic builds.

    Each container comes pre-loaded with kubectx/kubens and custom bash functions (json(), yaml(), sniff-dns(), cert-check())
    for faster debugging sessions.

    The CI pipeline uses GitHub Actions with Docker Buildx and QEMU to produce multi-architecture images (amd64, arm64).
    Trivy scanning runs mid-pipeline with hard-fail gates on HIGH or CRITICAL findings, and Hadolint lints every Dockerfile.
    I wrote smoke tests (tests/smoke.sh) that run inside the built containers during CI to verify every tool is present
    and functional before publishing.

    Images are published to both GHCR and Docker Hub with standard OCI metadata labels (org.opencontainers.image.*)
    injected at build time. A local Makefile wraps the full quality loop (Hadolint, Docker build, smoke tests, Trivy scans)
    for pre-push validation.

    The project includes a documentation site published via MkDocs and GitHub Pages, along with CONTRIBUTING.md,
    CODE_OF_CONDUCT.md, and SECURITY.md.
  sections:
    - title: "Container Design"
      items:
        - "Built 3 purpose-specific variants (Lite, Balanced, Power) on Alpine Linux, ranging from 15MB to 91MB. The Lite variant is 93% smaller than netshoot for basic DNS and HTTP debugging."
        - "Separated Dockerfiles (declarative) from installation scripts (procedural). Package lists live in '.packages' files; complex installs (like yq with architecture detection and SHA256 verification) have dedicated scripts."
        - "Pinned all tool versions and base images for deterministic, repeatable builds."
    - title: "Kubernetes Developer Experience"
      items:
        - "Pre-loaded kubectx/kubens aliases and custom bash functions (json(), yaml(), sniff-dns(), cert-check()) into the container's .bashrc for faster debugging sessions."
    - title: "CI/CD & Release Automation"
      items:
        - "Built GitHub Actions pipelines using Docker Buildx and QEMU to produce multi-arch images (amd64, arm64)."
        - "Injected standard OCI labels (org.opencontainers.image.*) into every image at build time."
        - "Published to both GHCR and Docker Hub on every release. Each release creates a full set of semantic version tags."
    - title: "Quality & Security"
      items:
        - "Integrated Trivy scanning mid-pipeline. HIGH or CRITICAL findings block the release."
        - "Wrote smoke tests (tests/smoke.sh) that run inside the built containers during CI to verify every tool is present and functional before publishing."
