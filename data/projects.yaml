- slug: silverstack-cicd-platform
  title: "SilverStack: Self-Hosted CI/CD on MicroVMs with 5 Custom OCI Images, Systemd Orchestration, Cloudflare Tunnels, and GitHub Actions CI"
  metaTitle: "SilverStack: Self-Hosted CI/CD on MicroVMs"
  category: platform
  status: maintained
  year: 2026
  shortDescription: >-
    Built a self-hosted CI/CD platform (Jenkins, SonarQube, Nexus) on iximiuz Labs microVMs
    with 5 custom OCI rootfs images using systemd as PID 1. Configured Cloudflare Tunnels
    for CGNAT traversal and published each environment as a publicly accessible playground.
  description: >-
    Built a self-hosted CI/CD platform (Jenkins, SonarQube, Nexus) running entirely inside iximiuz Labs
    microVMs instead of public cloud instances. The core constraint was no public IPs, shared NAT behind
    Carrier-Grade NAT (CGNAT), and ephemeral microVM file systems that lose state on every reboot.

    I created 5 custom OCI rootfs images from a base Ubuntu layer, each using systemd as PID 1. Runtime
    provisioning (PostgreSQL database creation, kernel parameter tuning like vm.max_map_count for SonarQube's
    Elasticsearch, and service orchestration) all happens at boot rather than being baked into the image.
    This keeps images modular: a standalone SonarQube environment, a Nexus registry, a Dev Machine, or the
    full unified CI/CD stack can each launch independently.

    To expose services externally despite CGNAT, I configured outbound-only Cloudflare Tunnels on custom
    domains, bypassing the need for inbound ports entirely. Nginx acts as a reverse proxy inside each
    microVM with a build-time parameterized upstream port, a /health endpoint for readiness checks, and
    hardened security headers. All services serve on port 80 regardless of the application's native port.

    On the CI side, I built GitHub Actions workflows for each image, and every image, including the shared base,
    now runs a build-time health check before it can be pushed: required binaries, directories and systemd unit
    wiring are asserted present, with 'nginx -t' parsing the real config on every service image that runs one.
    Security is enforced through
    strict sudoers profiles, daemon user isolation, pinned binary versions with SHA256 checksum verification, and
    ephemeral SSH key generation per microVM instance. Each image is published as a publicly accessible playground
    on iximiuz Labs.
  sections:
    - title: "OS Engineering & Modular Architecture"
      items:
        - "Created 5 distinct OCI rootfs images from a custom Ubuntu base. Each image is independently launchable: a standalone SonarQube environment, a Nexus registry, a Dev Machine, or the full unified CI/CD stack."
        - "Decoupled CI/CD tooling from the base images. Wrote systemd unit files and shell scripts to dynamically provision PostgreSQL databases, configure kernel limits, and reconstruct volatile file systems during microVM boot."
    - title: "Continuous Integration & Automated Publishing"
      items:
        - "Built GitHub Actions workflows for each image (e.g., build-jenkins-rootfs) to automate the full build-test-push cycle, replacing manual image builds."
        - "Added a build-time health check to every image, including the shared base: required binaries, directories and systemd unit wiring are asserted present, with 'nginx -t' parsing the real config on every service image that runs one. The script exits nonzero on any failure, which fails the build, so only passing images reach GHCR."
    - title: "Networking & Edge Routing"
      items:
        - "Worked around Carrier-Grade NAT (CGNAT) and the lack of public IPs by configuring outbound-only Cloudflare Tunnels, exposing CI/CD services on custom domains without opening inbound firewall ports."
        - "Configured Nginx as a reverse proxy in each image with a build-time parameterized upstream port (__SERVICE_PORT__), a /health endpoint for readiness checks, and hardened security headers (X-Frame-Options, X-Content-Type-Options, Referrer-Policy). All services serve on port 80 regardless of the application's native port."
    - title: "Security & Access Control"
      items:
        - "Enforced least-privilege access through strict sudoers profiles, daemon user isolation, and ephemeral SSH key generation per microVM instance."
        - "Pinned all third-party binaries to specific versions and validated downloads via SHA256 checksums to reduce supply chain risk."
