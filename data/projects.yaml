- slug: polyglot-monolith-deployment
  title: "Polyglot Deployment: Java, Python, and Node.js Across EC2, ECS, Bare-Metal K8s, and EKS with Kustomize Overlays and Multi-Stage Docker"
  metaTitle: "Polyglot Deployment: Java, Python and Node.js"
  category: platform
  status: completed
  year: 2026
  shortDescription: >-
    Containerized three applications (Java, Python, Node.js) and deployed each across EC2, ECS,
    bare-metal Kubernetes, and EKS. Wrote Kustomize overlays sharing 80% of base manifests between environments.
  description: >-
    Containerized three monolithic applications (Java Spring Boot 3.4/Java 21, Python Flask 3.12, Node.js 22 Express)
    and deployed each across four compute models: EC2 with Auto Scaling Groups, ECS Fargate, bare-metal Kubernetes
    (kubeadm), and Amazon EKS.

    Before containerizing, I audited and upgraded all three codebases, injected container health probe endpoints
    ('/health' for Flask and Express, '/actuator/health' for Spring Boot), and standardized database connectivity.
    The same application code connects to localhost on bare-metal, Docker Compose DNS names ('mysql'/'postgres') in
    local dev, and Amazon RDS endpoints in cloud environments, all without source code changes (only environment variables).

    The Node.js application required a structural refactor: I split it from a 2-tier model (Express serving both API
    and UI) into a 3-tier architecture with Nginx serving the React frontend and proxying API requests to the Express backend.

    I built multi-stage Dockerfiles for each stack: Webpack build stage into Alpine Nginx runtime for the Node frontend
    (excluding the Node toolchain entirely), Java 21 slim runtime for Spring Boot, and Gunicorn for Flask. I debugged
    environment-specific edge cases along the way (python-dotenv URL truncation, PostgreSQL 15+ schema-level grants,
    JDBC URL quoting in shell scripts).

    On the Kubernetes side, I wrote a Kustomize overlay structure where bare-metal and EKS deployments share over 80%
    of the same base manifests. Environment-specific overlays inject StatefulSets, StorageClasses, and RDS connection
    strings without modifying the shared base. The Python Flask application stays as a single-container deployment
    with Gunicorn instead of forcing a microservice split.
  sections:
    - title: "Codebase Preparation & Database Connectivity"
      items:
        - "Upgraded three codebases (Spring Boot 3.4.5/Java 21, Node.js 22, Python 3.12). Injected container health endpoints ('/health', '/actuator/health') to satisfy Kubernetes readiness probes."
        - "Standardized database connectivity across environments: localhost for bare-metal, Docker Compose DNS ('mysql'/'postgres') for local dev, and Amazon RDS endpoints for cloud. No source code changes required between environments."
        - "Debugged environment-specific edge cases: python-dotenv URL truncation, PostgreSQL 15+ schema-level grants, and JDBC URL quoting in shell scripts."
    - title: "Containerization & Refactoring"
      items:
