- slug: java-monolith
  title: "BankApp: Same Java Artifact Deployed Across EC2 Auto Scaling, ECS Fargate, and Amazon EKS with RDS, Gateway API, and Kustomize"
  metaTitle: "BankApp: One Java Artifact on EC2, ECS and EKS"
  category: platform
  status: completed
  year: 2026
  shortDescription: >-
    Deployed the same Java artifact across EC2, ECS Fargate, and Amazon EKS to compare each
    compute model firsthand. Shared one VPC and RDS instance across all three and reduced
    the image by 60% with multi-stage builds.
  description: >-
    Took a monolithic Java banking application (Spring Boot 3.4, Java 21) and deployed the same immutable artifact
    across three AWS compute models to understand the operational trade-offs of each firsthand: EC2 instances with
    Auto Scaling Groups, serverless ECS Fargate tasks, and Amazon EKS pods. All three deployments share the same VPC,
    security groups, and RDS instance, so the only variable is the compute layer itself.

    Before deploying, I decoupled the application's embedded H2 database to a managed Amazon RDS instance for
    independent scaling and backups. I reduced the container image size by over 60% using multi-stage Docker builds
    (Maven build stage into a Java 21 slim runtime).

    On EKS, I adopted the Kubernetes Gateway API over legacy Ingress, integrated with the AWS Application Load
    Balancer for traffic routing. I aligned JVM memory parameters (-Xmx, -Xms) with Kubernetes resource limits to
    prevent OOM kills, and wrote Kustomize manifests to manage the deployment declaratively.
  sections:
    - title: "Multi-Compute Deployment"
      items:
        - "Deployed the same application across EC2, ECS Fargate, and EKS to compare the operational trade-offs of each compute model firsthand."
        - "Reused the same VPC, security groups, and RDS instance across all three deployment phases."
    - title: "Containerization & Modernization"
      items:
        - "Decoupled the application's embedded database to a managed Amazon RDS instance for independent scaling and backups."
        - "Reduced the container image size by over 60% using multi-stage Docker builds with a Java 21 runtime base."
    - title: "Kubernetes & Traffic Routing"
      items:
