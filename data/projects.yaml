- slug: microservices-demo
  title: "Microservices GitOps on Amazon EKS with Terraform, 3 CI Pipelines, ArgoCD Image Updater, ExternalDNS, Gateway API, and Observability"
  metaTitle: "Microservices GitOps on Amazon EKS with ArgoCD"
  category: platform
  status: completed
  year: 2026
  shortDescription: >-
    Deployed 10 microservices on Amazon EKS with Terraform, 3 CI pipelines, and fully automated
    GitOps delivery via ArgoCD Image Updater. Configured Gateway API routing, ExternalDNS, and
    observability with Prometheus and the Elastic Stack.
  description: >-
    Deployed Google's Online Boutique (10-service polyglot monorepo) on Amazon EKS with a fully automated
    DevOps architecture built from scratch. I provisioned the entire AWS environment (VPCs, bastion host,
    EKS cluster with self-managed Auto Scaling Groups) using modular Terraform. The KodeKloud lab environment's
    Service Control Policies (SCPs) blocked EKS managed node groups, so I created self-managed worker nodes
    to work within those constraints.

    For CI, I built 3 GitHub Actions pipelines with dynamic matrix dispatch: one detects which microservices
    changed and compiles only those, one runs Trivy filesystem and container image scans, and one packages
    and publishes Helm charts to GHCR as OCI artifacts.

    The continuous delivery chain is fully automated with zero manual intervention. CI pushes images to GHCR,
    ArgoCD Image Updater detects new digests (matched on SHA-256 instead of timestamps to avoid BuildKit epoch-related
    ordering issues) and triggers EKS rollouts. Image Updater uses the 'argocd' write method to patch image
    overrides in-memory, keeping the CD repository's Git history clean.

    CI and CD are strictly separated: CI tokens are scoped to 'Contents: Read+Write' on the CD repository only,
    and no pipeline has kubectl access to the cluster. I kept the upstream Helm chart unmodified and used
    Kustomize within ArgoCD to inject custom Gateway API manifests as overlays.

    Traffic routing uses the Kubernetes Gateway API with a shared ALB across 5 HTTPRoutes. ExternalDNS automatically
    creates and reconciles Route 53 DNS records from those Gateway API resources. HPA handles CPU-based pod
    autoscaling via the Metrics Server, and an ACM wildcard certificate provides TLS across all subdomains.

    Observability is deployed independently of the application so monitoring stays operational even if ArgoCD
    or the CI pipeline fails. kube-prometheus-stack handles metrics with AlertManager pushing alerts to Slack.
    The Elastic Stack (Elasticsearch on gp3 PVCs via the EBS CSI driver, Filebeat, Kibana) provides centralized
    logging across the 4-node cluster.
  sections:
    - title: "AWS Infrastructure"
      items:
        - "Provisioned the full AWS environment (VPCs, bastion host, EKS cluster) using modular Terraform."
        - "Worked around KodeKloud lab Service Control Policies (SCPs) that blocked EKS managed node groups by creating self-managed Auto Scaling Groups."
        - "Configured the EBS CSI driver with gp3 as the default StorageClass for better throughput-per-dollar on Elasticsearch PVCs."
        - "Provisioned an ACM wildcard certificate (*.ibtisam.qzz.io) and attached it to a shared Application Load Balancer for TLS across all subdomains."
    - title: "Kubernetes & Traffic Routing"
      items:
        - "Adopted the Kubernetes Gateway API over legacy Ingress. Configured the AWS Load Balancer Controller to share a single ALB across 5 HTTPRoutes."
        - "Integrated ExternalDNS to automatically create and reconcile Route 53 records from Gateway API manifests."
        - "Configured Horizontal Pod Autoscalers (HPA) to scale frontend pods based on CPU utilization via the Metrics Server."
        - "Kept the upstream Helm chart unmodified. Used Kustomize within ArgoCD to inject custom Gateway API manifests as overlays."
    - title: "GitOps & Continuous Delivery"
      items:
        - "Set up an automated delivery pipeline: GitHub Actions pushes OCI artifacts to GHCR, ArgoCD Image Updater detects new images and triggers EKS rollouts."
        - "Configured Image Updater to match on SHA-256 digests instead of timestamps to avoid BuildKit epoch-related ordering issues."
        - "Used the ArgoCD 'argocd' write method to patch image overrides in-memory, keeping the Git history of the CD repository clean."
    - title: "CI Pipeline & Security"
      items:
        - "Built 3 GitHub Actions pipelines with dynamic matrix dispatch to compile and test only modified microservices."
        - "Enforced strict CI/CD separation: the CI repository has no access to the EKS cluster. Deployments happen entirely through pull-based GitOps."
        - "Scoped CI deployment tokens to 'Contents: Read+Write' on the CD repository only."
        - "Integrated Trivy filesystem and container image scanning to block vulnerabilities before artifacts reach the registry."
    - title: "Observability"
      items:
        - "Deployed observability tools independently of the application so monitoring stays operational even if ArgoCD or the CI pipeline fails."
        - "Set up kube-prometheus-stack for metrics. Configured AlertManager to push cluster alerts to Slack."
        - "Deployed the Elastic Stack (Elasticsearch, Filebeat, Kibana) to aggregate logs across the 4-node EKS cluster."
