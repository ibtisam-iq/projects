- slug: retail-store-sample-app
  title: "Multi-Environment Deployment from Bare-Metal to Amazon EKS with Helmfile, IRSA, DynamoDB, SQS/Lambda/SNS, and CloudWatch"
  metaTitle: "Bare-Metal Kubernetes to Amazon EKS with Helmfile"
  category: platform
  status: completed
  year: 2026
  shortDescription: >-
    Deployed 5 microservices across bare-metal Kubernetes and Amazon EKS, decoupling all AWS
    dependencies for portability. Configured IRSA, Helmfile orchestration, a serverless event
    pipeline (SQS, Lambda, SNS), and CloudWatch logging.
  description: >-
    Deployed AWS's retail store demo (5 microservices) across two environments to prove application portability:
    a bare-metal kubeadm cluster (provisioned via SilverStack) and Amazon EKS. The upstream application is tightly
    coupled to AWS managed services, so I first decoupled all cloud dependencies by creating custom values-*.yaml
    overrides that swap DynamoDB, SQS, and ElastiCache with containerized alternatives (RabbitMQ, Redis, NodePort)
    at deploy time. All 5 upstream Helm charts stayed unmodified.

    I wrote 3 target-specific Helmfile configurations using the 'needs:' directive to enforce dependency sequencing.
    Databases and message brokers provision before application microservices, preventing startup race conditions.

    For the EKS deployment, I provisioned IAM roles via Terraform, deployed the control plane via eksctl, and
    created self-managed CloudFormation worker nodes to bypass SCP restrictions on managed node groups. I configured
    IRSA (IAM Roles for Service Accounts) to bind the Cart service to DynamoDB and the Orders service to a serverless
    event pipeline (SQS triggers Lambda, which publishes to SNS).

    Traffic routing uses the AWS Load Balancer Controller with an Ingress Group that shares a single ALB across the UI,
    Prometheus, and Grafana. Logging is handled by Fluent Bit streaming to CloudWatch Container Insights for
    native AWS log aggregation.
  sections:
    - title: "Bare-Metal Portability"
      items:
        - "Kept all 5 upstream microservice Helm charts unmodified. Created environment-specific values-*.yaml overrides to swap cloud dependencies at deploy time."
        - "Replaced DynamoDB, SQS, ElastiCache, and ALB Ingress with local alternatives (RabbitMQ, Redis, NodePort) to deploy the full stack on a bare-metal kubeadm cluster."
    - title: "Deployment Orchestration"
      items:
        - "Wrote a Helmfile layer to consolidate 5 separate Helm releases into a single declarative deployment."
        - "Created 3 target-specific Helmfile configurations using the 'needs:' directive to enforce dependency ordering (databases and brokers provision before microservices)."
    - title: "Amazon EKS Deployment"
      items:
        - "Provisioned IAM roles via Terraform, deployed the control plane via eksctl, and created self-managed worker nodes via CloudFormation to bypass SCP restrictions on managed node groups."
        - "Configured IRSA to bind the Cart service to DynamoDB and the Orders service to a serverless event pipeline (SQS, Lambda, SNS)."
        - "Deployed the AWS Load Balancer Controller and configured an Ingress Group to share a single ALB across the UI, Prometheus, and Grafana."
        - "Deployed Fluent Bit to stream logs to CloudWatch Container Insights."
