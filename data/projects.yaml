- slug: aws-secure-static-hosting
  title: "Static Hosting on AWS with CloudFront OAC, Cross-Region Replication, Dual-KMS Encryption, CloudTrail Auditing, and Lifecycle Management"
  metaTitle: "Zero-Compute Static Hosting on AWS with CloudFront"
  category: platform
  status: completed
  year: 2026
  shortDescription: >-
    Built a zero-compute hosting architecture on AWS using CloudFront OAC with SigV4 signing
    against a private S3 origin. Configured Cross-Region Replication with dual-KMS encryption,
    CloudTrail auditing, and Glacier lifecycle policies.
  description: >-
    Built a static hosting architecture on AWS with zero compute resources. Content is served globally through a CloudFront
    distribution using Origin Access Control (OAC) with SigV4 signing (not the legacy Origin Access Identity) to authenticate
    requests against a fully private S3 origin secured with account-level public access blocks.

    I provisioned an ACM wildcard certificate on a custom domain and configured CloudFront Custom Error Responses to
    handle SPA client-side routing by returning index.html for 403s on missing paths.

    For disaster recovery, I configured Cross-Region Replication from us-east-1 to us-west-2 with separate KMS Customer
    Managed Keys per region. Objects are decrypted at the source and re-encrypted at the destination, so each region
    maintains independent key material. I enabled S3 Bucket Keys to batch KMS GenerateDataKey calls per-bucket instead
    of per-object, reducing API costs.

    Observability is layered: CloudTrail logs management and data events across both the primary and replica buckets,
    while S3 Server Access Logs capture per-request HTTP telemetry with dedicated IAM policies for the logging service principal.
    An S3 Lifecycle Policy transitions non-current object versions to Glacier after 30 days to manage storage costs for
    versioned content.

    Deployed on a personal AWS account and kept live for 7 days. Total cloud cost: $1.45 across CloudFront, S3 (3 buckets),
    CloudTrail, and KMS, covered by AWS Free Tier credits.
  sections:
    - title: "Storage & Replication"
      items:
        - "Created dual-region S3 buckets (us-east-1 and us-west-2) with all public access blocked at the account level."
        - "Configured Cross-Region Replication with separate KMS Customer Managed Keys per region. Objects are decrypted at the source and re-encrypted at the destination."
        - "Enabled S3 Bucket Keys to reduce KMS API call costs (GenerateDataKey calls are batched per-bucket instead of per-object)."
    - title: "CDN & TLS"
      items:
        - "Set up a CloudFront distribution with an ACM wildcard certificate on a custom domain."
        - "Used Origin Access Control (OAC) with SigV4 signing instead of the legacy Origin Access Identity (OAI) to authenticate requests to the private S3 origin."
        - "Configured CloudFront Custom Error Responses to handle SPA client-side routing (returning index.html for 403s on missing paths)."
    - title: "Observability & Lifecycle"
      items:
        - "Configured CloudTrail to log management and data events across both the primary and replica buckets."
        - "Enabled S3 Server Access Logs for per-request HTTP telemetry, with dedicated IAM policies for the logging service principal."
        - "Set up an S3 Lifecycle Policy to transition non-current object versions to Glacier after 30 days."
